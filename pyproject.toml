[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-service"
version = "0.1.0"
description = "Fraud scoring service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "fastapi[standard]>=0.115",
    "uvicorn>=0.30",
    "pandas",
    "scikit-learn",
    "joblib",
    "pydantic-settings",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=fraud_service --cov-branch --cov-report=term-missing"
markers = [
    "unit: fast, no I/O",
    "integration: app-level via TestClient",
    "behavioural: exercises the real model artefact",
    "slow: excluded from the per-commit gate",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/fraud_service"]
omit = [
    "src/fraud_service/adapters/*",
    "src/fraud_service/batch.py",
]

[tool.coverage.report]
fail_under = 80

[tool.importlinter]
root_package = "fraud_service"

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
layers = [
    "fraud_service.api",
    "fraud_service.adapters",
    "fraud_service.service",
    "fraud_service.domain",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
"src/fraud_service/api/routes.py" = ["B008"]