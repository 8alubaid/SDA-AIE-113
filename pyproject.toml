[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-service"
version = "0.1.0"
description = "Fraud scoring service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pandas",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

